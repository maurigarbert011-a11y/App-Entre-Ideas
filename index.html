<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entre Ideas - Radio 102.7 FM Centro Durazno</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            max-width: 600px;
            width: 100%;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 40px 20px;
            text-align: center;
        }

        .description {
            color: #333;
            margin-bottom: 40px;
            font-size: 1.1em;
            line-height: 1.6;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            padding: 15px 40px;
            font-size: 1.1em;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-radio {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }

        .btn-radio:hover {
            background: linear-gradient(135deg, #f5576c 0%, #f093fb 100%);
        }

        .btn-youtube {
            background: linear-gradient(135deg, #ff0000 0%, #cc0000 100%);
            color: white;
        }

        .btn-youtube:hover {
            background: linear-gradient(135deg, #cc0000 0%, #ff0000 100%);
        }

        .icon {
            font-size: 1.5em;
        }

        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #eee;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 2em;
            }

            .buttons-container {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Entre Ideas</h1>
            <p>Radio 102.7 FM Centro Durazno</p>
        </div>

        <div class="content">
            <div class="description">
                <p>Bienvenido a Entre Ideas, el programa de radio y streaming de Durazno.</p>
                <p>Información, entrevistas, actualidad y mucho más.</p>
            </div>

            <div class="buttons-container">
                <a href="https://1027fmcentro.com" class="btn btn-radio" target="_blank" rel="noopener noreferrer">
                    <span class="icon">📻</span>
                    <span>Radio 102.7 FM</span>
                </a>
                <a href="https://youtube.com/live/xo8RBDsqncA?feature=shared" class="btn btn-youtube" target="_blank" rel="noopener noreferrer">
                    <span class="icon">▶️</span>
                    <span>En Vivo YouTube</span>
                </a>
            </div>
        </div>

        <div class="footer">
            <p>&copy; 2026 Entre Ideas - Todos los derechos reservados</p>
        </div>
    </div>
</body>
</html>
